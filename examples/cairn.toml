# Minimal offline-friendly Cairn configuration.
#
# The hash embedding provider below is deterministic test/demo infrastructure.
# It is NOT suitable for production retrieval or retrieval-quality evaluation.

[chunker]
strategy = "cdc-rabin"
window_words = 48
min_tokens = 180
max_tokens = 640

# Snapping is experimental and opt-in. Leave it disabled unless you have
# evaluated retrieval behavior and completed any appropriate patent review.
# To opt in, change strategy above to "cdc-rabin+snap".
snap_window_words = 24
primary_mask_bits = 8
backup_mask_bits = 6

[embedding]
provider = "hash"
model = "cairn-hash-256-v1"
dimensions = 256
batch_size = 64
price_per_million_tokens = 0.0

[store]
cache = ".cairn/cache.sqlite3"

[index]
backend = "sqlite"
database = ".cairn/index.sqlite3"

[sources]
include = ["docs/**/*.md"]
exclude = ["**/drafts/**", "**/.*/**"]
