name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and release tools
        run: python -m pip install -e ".[dev]" twine

      - name: Lint release source
        run: python -m ruff check .

      - name: Check release formatting
        run: python -m ruff format --check .

      - name: Type-check release source
        run: python -m mypy src/cairn_rag

      - name: Test release source
        run: python -m pytest

      - name: Verify exact release tag and classify version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          from packaging.version import Version

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          assert actual == expected, f"release tag {actual!r} must exactly match {expected!r}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_prerelease={str(Version(version).is_prerelease).lower()}\n")
          PY

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -c "import cairn_rag"
          python -m cairn_rag --version
          cairn-rag --version
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          cairn-rag init --json > init.json
          mkdir docs
          printf '%s\n' 'alpha beta gamma delta epsilon' > docs/smoke.md
          cairn-rag plan --json > plan.json
          cairn-rag index --json > index.json
          cairn-rag query 'alpha beta' --json > query.json
          cairn-rag verify --json > verify.json

      - name: Attest distributions
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*"

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  website:
    name: Validate website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint website
        run: npm run lint

      - name: Type-check website
        run: npm run typecheck

      - name: Build website
        run: npm run build

  publish-github:
    name: Create GitHub release
    needs: [build, website]
    if: ${{ vars.CAIRN_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create or update release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: [build, website, publish-github]
    if: ${{ vars.CAIRN_RELEASE_ENABLED == 'true' && needs.build.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cairn-rag
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
